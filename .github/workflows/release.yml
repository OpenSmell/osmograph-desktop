name: Build & Release

# Tag pushes build and publish releases; workflow_dispatch supports manual rebuilds.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows
          - platform: macos-latest
            os: macos
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout osmograph-desktop
        uses: actions/checkout@v4
        with:
          path: osmograph-desktop

      - name: Checkout opensmell-rs (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: OpenSmell/opensmell-rs
          ref: master
          path: opensmell-rs

      - name: Checkout data-commons (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: praisejamesx/data-commons
          ref: main
          path: data-commons

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osmograph-desktop/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libudev-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: osmograph-desktop
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: osmograph-desktop
        run: npm run check:versions -- "${{ github.ref_name }}"

      - name: Require updater signing on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: osmograph-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Tagged releases must be signed so installed builds can verify updates."
            echo "Run: npm run setup:updater-keys"
            echo "Then add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repository secrets."
            exit 1
          fi
          node -e '
            const c = require("./src-tauri/tauri.conf.json");
            if (!c.plugins?.updater?.pubkey) {
              console.error("::error::tauri.conf.json has no updater public key; run npm run setup:updater-keys.");
              process.exit(1);
            }
          '

      - name: Build Tauri app (Linux packages)
        if: matrix.os == 'linux'
        working-directory: osmograph-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          npx tauri build --bundles deb rpm $EXTRA 2>&1 | tee "${{ github.workspace }}/build-${{ matrix.os }}.log"
        shell: bash

      - name: Build AppImage (best effort)
        if: matrix.os == 'linux'
        working-directory: osmograph-desktop
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          npx tauri build --bundles appimage $EXTRA 2>&1 | tee "${{ github.workspace }}/build-appimage.log"
        shell: bash

      - name: Build Tauri app (Windows/macOS)
        if: matrix.os != 'linux'
        working-directory: osmograph-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA="--config src-tauri/tauri.updater.conf.json"
          fi
          # WiX/MSI only accepts numeric prerelease identifiers, so a tag like
          # v0.1.2-beta.2 must ship the NSIS installer (which supports semver).
          BUNDLES=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            case "$VERSION" in
              *-*) BUNDLES="--bundles nsis" ;;
            esac
          fi
          npx tauri build $BUNDLES $EXTRA 2>&1 | tee "${{ github.workspace }}/build-${{ matrix.os }}.log"
        shell: bash

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: |
            build-${{ matrix.os }}.log
            build-appimage.log
          if-no-files-found: warn

      - name: Collect bundle assets
        id: assets
        shell: bash
        working-directory: osmograph-desktop
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/release/bundle"
          ART="$GITHUB_WORKSPACE/dist-artifacts"
          mkdir -p "$ART"

          pick() {
            ls $1 2>/dev/null | head -n1 || true
          }
          # Keep the friendly alias and its updater signature together. The
          # signature covers the bytes, not the filename, so pairing matters.
          # Updater payloads are skipped when unsigned so a partial bundle from
          # a failed step can never be advertised as installable.
          copy_pair() {
            local f="$1" dest="$2" require_sig="${3:-no}"
            if [ -n "$f" ] && [ -f "$f" ]; then
              if [ "$require_sig" = "yes" ] && [ ! -f "$f.sig" ]; then
                echo "::warning::Skipping unsigned $f"
                return
              fi
              cp "$f" "$ART/$dest"
              if [ -f "$f.sig" ]; then
                cp "$f.sig" "$ART/$dest.sig"
              fi
            fi
          }

          if [ "${{ matrix.os }}" = "windows" ]; then
            NSIS="$(pick "$BUNDLE_DIR/nsis/*setup*.exe")"
            if [ -z "$NSIS" ]; then NSIS="$(pick "$BUNDLE_DIR/nsis/*.exe")"; fi
            copy_pair "$NSIS" "Osmograph-setup.exe" yes
            copy_pair "$(pick "$BUNDLE_DIR/msi/*.msi")" "Osmograph.msi" yes
          elif [ "${{ matrix.os }}" = "linux" ]; then
            copy_pair "$(pick "$BUNDLE_DIR/deb/*.deb")" "Osmograph-linux-amd64.deb" yes
            copy_pair "$(pick "$BUNDLE_DIR/appimage/*.AppImage")" "Osmograph-linux-x86_64.AppImage" yes
            copy_pair "$(pick "$BUNDLE_DIR/rpm/*.rpm")" "Osmograph-linux-x86_64.rpm" yes
          elif [ "${{ matrix.os }}" = "macos" ]; then
            ARCH=$(uname -m)
            case "$ARCH" in
              arm64) ARCH=aarch64 ;;
              x86_64) ARCH=x86_64 ;;
            esac
            copy_pair "$(pick "$BUNDLE_DIR/dmg/*.dmg")" "Osmograph-macos-${ARCH}.dmg"
            copy_pair "$(pick "$BUNDLE_DIR/macos/*.app.tar.gz")" "Osmograph-macos-${ARCH}.app.tar.gz" yes
          fi

          (
            cd "$ART"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- * > SHA256SUMS.txt 2>/dev/null || true
            else
              shasum -a 256 * > SHA256SUMS.txt 2>/dev/null || true
            fi
          )

          ls -la "$ART/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Osmograph-${{ matrix.os }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout osmograph-desktop
        uses: actions/checkout@v4
        with:
          path: osmograph-desktop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate signed updater manifest
        working-directory: osmograph-desktop
        run: |
          node scripts/make-latest-json.mjs \
            --dir "${{ github.workspace }}/release-assets" \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out "${{ github.workspace }}/release-assets/latest.json"

      - name: Inspect assets
        run: ls -laR release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/**
